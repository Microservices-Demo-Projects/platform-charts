apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-tls
  namespace: headlamp
spec:
  secretName: headlamp-tls
  commonName: "headlamp"
  dnsNames:
    - headlamp
    - headlamp.headlamp.svc
    - headlamp.headlamp.svc.cluster.local
    - localhost
  issuerRef:
    name: demo-ca
    kind: ClusterIssuer
