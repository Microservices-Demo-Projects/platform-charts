# Health checks ArgoCD doesn't have out of the box. Both are needed for the sync
# waves below to actually gate on anything.
#
# These MUST go on the ArgoCD CR, not on a ConfigMap. Two ConfigMaps look like
# plausible homes and neither works:
#
#   - openshift-gitops-cm - nothing reads it. It carries the
#     app.kubernetes.io/part-of: argocd label, which makes it look like ArgoCD
#     config, but the application-controller runs without --configmap-name, so
#     it only ever reads argocd-cm. Health checks written here are silently
#     ignored: platform-root then treats every child as instantly Healthy and
#     creates all 10 at once, blowing through every wave in ~20 seconds.
#   - argocd-cm - the real one, but operator-owned (ownerReferences ->
#     ArgoCD/openshift-gitops, operator.argoproj.io/tracked-by: argocd). The
#     operator reconciles it, so hand-written keys get reverted.
#
# spec.resourceHealthChecks is the operator's supported input for exactly this:
# it renders each entry into argocd-cm as
# resource.customizations.health.<group>_<kind>, which the controller picks up
# live - no restart.
#
# Two sync options are load-bearing here:
#
#   - ServerSideApply=true. This is a PARTIAL ArgoCD CR - it declares only
#     spec.resourceHealthChecks. A client-side apply would send it as the whole
#     object and wipe every other field on the instance, including the
#     spec.namespaceManagement grants from the prerequisite setup. Server-side
#     apply makes ArgoCD own only the fields it actually declares and leaves the
#     rest to their own field managers.
#   - Delete=false,Prune=false. Without these, pruning this Application (or
#     platform-root cascading) would delete the ArgoCD CR itself - i.e. destroy
#     the ArgoCD instance doing the syncing, taking the whole platform with it.
#
# Wave 0, so the checks are registered before the resources they assess exist.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
spec:
  resourceHealthChecks:
    # ArgoCD dropped this check in 1.8, so by default platform-root thinks every
    # child is instantly healthy and ignores the waves entirely.
    - group: argoproj.io
      kind: Application
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for the child app to be Synced and Healthy"

        if obj.status ~= nil then
          -- A failed sync (e.g. a PostSync smoke test) still leaves sync=Synced and
          -- health=Healthy behind, so check the operation too.
          local op = obj.status.operationState
          if op ~= nil and (op.phase == "Failed" or op.phase == "Error") then
            hs.status = "Degraded"
            hs.message = op.message or ("last sync " .. op.phase)
            return hs
          end

          if obj.status.health ~= nil and obj.status.sync ~= nil then
            if obj.status.health.status == "Degraded" then
              hs.status = "Degraded"
              hs.message = obj.status.health.message or "child app is Degraded"
            elseif obj.status.sync.status == "Synced" and obj.status.health.status == "Healthy" then
              hs.status = "Healthy"
              hs.message = "child app is Synced and Healthy"
            end
          end
        end

        return hs
    # ArgoCD has no check for a Vault resource, so without this the vault app
    # reports Healthy the moment the CR is created - before Vault is unsealed -
    # and wave 50/60 would sync against a Vault that isn't usable yet.
    # status.leader/conditions confirmed against vault-operator:1.24.0's CRD.
    - group: vault.banzaicloud.com
      kind: Vault
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for the Vault raft cluster to elect a leader"
        if obj.status ~= nil then
          for i, condition in ipairs(obj.status.conditions or {}) do
            if condition.type == "Failed" and condition.status == "True" then
              hs.status = "Degraded"
              hs.message = condition.message or condition.error or "Vault reconciliation failed"
              return hs
            end
          end
          if obj.status.leader ~= nil and obj.status.leader ~= "" then
            hs.status = "Healthy"
            hs.message = "Vault raft cluster has a leader: " .. obj.status.leader
            return hs
          end
        end
        return hs
