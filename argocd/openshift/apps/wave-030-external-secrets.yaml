# The ESO controller, from the same upstream Helm chart the Kubernetes path
# uses (external-secrets/common/chart), with OpenShift-specific values.
#
# This deliberately does NOT use the community external-secrets-operator OLM
# Subscription (kept for reference at external-secrets/openshift/config/operator
# - see that directory's README note). That operator's own image,
# ghcr.io/external-secrets/external-secrets-helm-operator, ships a single
# linux/amd64 manifest with no arm64 build, so on an arm64 node it runs under
# emulation and dies in the Go runtime's GC (CrashLoopBackOff with
# asm_amd64.s / runtime.gcBgMarkWorker in the panic trace).
#
# The chart's operand image, ghcr.io/external-secrets/external-secrets, is a
# proper multi-arch manifest list (linux/amd64, linux/arm64, linux/ppc64le,
# linux/s390x), so the container runtime resolves the right architecture per
# node with nothing to parameterize: this works on an arm64 CRC laptop today
# and on amd64 cloud nodes later, from the identical manifests.
#
# The ESO mTLS client Certificate and the ClusterSecretStore both wait for
# Vault's kubernetes-auth role and are deployed separately at wave 50.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: openshift-gitops
  # Cascades deletion to this Application's own resources, so removing the
  # parent platform-root (which deletes this Application) also tears down what
  # it deployed instead of orphaning it.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: external-secrets/common/chart
      helm:
        valueFiles:
          - $values/external-secrets/openshift/values.yaml
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      ref: values
      path: external-secrets/openshift
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: external-secrets/openshift/config/namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Also lets the chart adopt CRDs an earlier OLM install of the operator
      # may have left behind (OLM doesn't remove CRDs when a CSV goes away),
      # rather than failing on "already exists".
      - ServerSideApply=true
    # Transient bootstrap failures (a dependency's webhook or API not
    # answering yet) are retried automatically instead of needing a manual
    # re-sync: ~10s/20s/40s/80s/160s.
    retry:
      limit: 5
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "3m"
