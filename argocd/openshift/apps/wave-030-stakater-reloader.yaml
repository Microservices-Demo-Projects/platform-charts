# Reloader via its Helm chart - no OLM operator exists for it. The chart's
# own defaults are already OpenShift-shaped (isOpenshift: true,
# readOnlyRootFilesystem) except for one thing the subchart hardcodes
# (runAsUser: 65534) that OpenShift's SCC rejects - see
# ../../../stakater-reloader/openshift/values.yaml and
# ../../../stakater-reloader/openshift/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stakater-reloader
  namespace: openshift-gitops
  # Cascades deletion to this Application's own resources, so removing the
  # parent platform-root (which deletes this Application) also tears down what
  # it deployed instead of orphaning it.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: stakater-reloader/common/chart
      helm:
        valueFiles:
          - $values/stakater-reloader/openshift/values.yaml
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      ref: values
      path: stakater-reloader/openshift
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: stakater-reloader/openshift/config/namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: stakater-reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Transient bootstrap failures (a dependency's webhook or API not
    # answering yet) are retried automatically instead of needing a manual
    # re-sync: ~10s/20s/40s/80s/160s.
    retry:
      limit: 5
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "3m"
