# The shared demo-ca root CA (ClusterIssuer + Certificate + intermediate
# ClusterIssuer) every other component's Certificate depends on, plus a
# PostSync smoke test proving cert-manager can actually issue against it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  # Cascades deletion to this Application's own resources, so removing the
  # parent platform-root (which deletes this Application) also tears down what
  # it deployed instead of orphaning it.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: cert-manager/config/kubernetes
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: cert-manager/tests/base
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Transient bootstrap failures (a dependency's webhook or API not
    # answering yet) are retried automatically instead of needing a manual
    # re-sync: ~10s/20s/40s/80s/160s.
    retry:
      limit: 5
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "3m"
