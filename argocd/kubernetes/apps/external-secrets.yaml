# ESO controller + its own mTLS client Certificate (no external dependency,
# so it rides along here). The ClusterSecretStore itself waits for
# vault-config's kubernetes-auth role and is deployed separately at wave 50.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: HEAD
      path: external-secrets/chart
      helm:
        valueFiles:
          - $values/kubernetes.yaml
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: HEAD
      ref: values
      path: external-secrets/values
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: HEAD
      path: external-secrets/config/kubernetes/certificate
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
