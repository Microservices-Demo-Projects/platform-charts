# The Vault CR itself (raft HA, auto-init/unseal, kv-v2 + database secrets
# engines, kubernetes auth) plus a PostSync smoke test, and the custom
# argocd-cm health check for vault.banzaicloud.com/Vault (ArgoCD has no
# built-in health check for this CRD, so without this the Application would
# report Healthy the instant the CR is created, before Vault is actually
# initialized/unsealed - which would let wave 50/60 start too early).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-config
  namespace: argocd
  # Cascades deletion to this Application's own resources, so removing the
  # parent platform-root (which deletes this Application) also tears down what
  # it deployed instead of orphaning it.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: hashicorp-vault/config/kubernetes
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: hashicorp-vault/tests/base
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Transient bootstrap failures (a dependency's webhook or API not
    # answering yet) are retried automatically instead of needing a manual
    # re-sync: ~10s/20s/40s/80s/160s.
    retry:
      limit: 5
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "3m"
