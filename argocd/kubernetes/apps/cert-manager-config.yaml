# The shared demo-ca root CA (ClusterIssuer + Certificate + intermediate
# ClusterIssuer) every other component's Certificate depends on, plus a
# PostSync smoke test proving cert-manager can actually issue against it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: HEAD
      path: cert-manager/config/kubernetes
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: HEAD
      path: cert-manager/tests/base
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
