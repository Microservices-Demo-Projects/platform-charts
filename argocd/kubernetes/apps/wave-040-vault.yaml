# The Vault server itself: its TLS certificate and the Vault CR (raft HA,
# auto-init/unseal, kv-v2 + database secrets engines, kubernetes auth), plus a
# PreSync gate that waits for its prerequisites and a PostSync smoke test.
#
# The vault-operator that reconciles this CR comes up at wave 30. The custom
# health check that stops this app reporting Healthy before Vault is unsealed
# lives in wave-000-argocd-health-checks.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  # Cascades deletion to this Application's own resources, so removing the
  # parent platform-root (which deletes this Application) also tears down what
  # it deployed instead of orphaning it.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: hashicorp-vault/common/config/base
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: hashicorp-vault/common/tests/base
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Transient bootstrap failures (a dependency's webhook or API not
    # answering yet) are retried automatically instead of needing a manual
    # re-sync: ~10s/20s/40s/80s/160s.
    retry:
      limit: 5
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "3m"
