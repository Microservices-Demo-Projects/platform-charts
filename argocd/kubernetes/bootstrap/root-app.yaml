# App-of-apps: the single Application a human/CI applies by hand. Syncing it
# applies every Application manifest in argocd/kubernetes/apps/, which then
# sync themselves in order via their own argocd.argoproj.io/sync-wave.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  # Makes `kubectl delete` of this Application cascade: without this finalizer
  # ArgoCD only removes the Application CR and leaves everything it deployed
  # running. Deleting platform-root therefore removes the child Applications
  # in argocd/kubernetes/apps/, and because each of those carries the same
  # finalizer, their own workloads come down too - tearing down the whole
  # platform (including postgres data and Vault's unseal keys) in one step.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
    targetRevision: feature/argocd-gitops-bootstrap
    path: argocd/kubernetes/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
