# Pulls the current postgres superuser password FROM Vault's
# postgres-superuser static role (hashicorp-vault/config/base/vault.yaml),
# which owns rotating it directly in the database. CNPG auto-creates
# `postgres-superuser` as a kubernetes.io/basic-auth Secret (cluster.yaml's
# enableSuperuserAccess: true, no superuserSecret override) and reconciles
# any password change in this Secret onto the live role, so refreshInterval
# just needs to be shorter than Vault's rotation_schedule to stay in sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local-vault-backend-database
    kind: ClusterSecretStore
  target:
    name: postgres-superuser
    creationPolicy: Merge
  data:
    - secretKey: password
      remoteRef:
        key: database/static-creds/postgres-superuser
        property: password
