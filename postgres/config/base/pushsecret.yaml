# Pushes the CNPG-generated superuser password into Vault, instead of the old
# ExternalSecret pulling a pre-seeded password FROM Vault. This breaks the old
# boot-order circular dependency (Postgres needing Vault to be up just to get
# its own root password before Postgres itself could ever start).
#
# CNPG auto-creates `<cluster-name>-superuser` (here: `postgres-superuser`) as
# a `kubernetes.io/basic-auth` Secret (username/password keys) because
# cluster.yaml sets enableSuperuserAccess: true and does not set
# superuserSecret.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: postgres-root-password
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: local-vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: postgres-superuser
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: kv/db/postgres-root
          property: password
