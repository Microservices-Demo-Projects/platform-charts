# Server TLS certificate for the CNPG "postgres" Cluster, issued off the
# shared `demo-ca` ClusterIssuer. The resulting secret's ca.crt (plus
# tls.crt/tls.key) lets it double as both serverTLSSecret and serverCASecret
# on the Cluster CR (cluster.yaml) - CNPG supports this when serverCASecret's
# ca.key is omitted. DNS names cover all three CNPG-created Services:
# postgres-rw (primary, rw), postgres-ro (replicas, ro), postgres-r (any, r).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server-tls
  namespace: postgres
spec:
  secretName: postgres-server-tls
  commonName: postgres-rw
  dnsNames:
    - postgres-rw
    - postgres-rw.postgres
    - postgres-rw.postgres.svc
    - postgres-rw.postgres.svc.cluster.local
    - postgres-ro
    - postgres-ro.postgres
    - postgres-ro.postgres.svc
    - postgres-ro.postgres.svc.cluster.local
    - postgres-r
    - postgres-r.postgres
    - postgres-r.postgres.svc
    - postgres-r.postgres.svc.cluster.local
  issuerRef:
    name: demo-ca
    kind: ClusterIssuer
