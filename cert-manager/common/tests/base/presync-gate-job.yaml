# PreSync gate: nothing in this app is applied until cert-manager can actually
# issue certificates.
#
# This app applies a self-signed ClusterIssuer, the demo-root-ca Certificate and
# the demo-ca ClusterIssuer - all of which pass through cert-manager's validating
# webhook. A webhook that isn't serving yet rejects them with a hard
# "connection refused", which fails the whole sync instead of being retried, so
# the gate waits for it and then proves it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-presync-gate
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # list/watch as well as get, so `kubectl wait` can observe the change.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # `create` is what a server-side dry-run authorises against - it runs the
  # admission chain and then discards the object, so nothing is created.
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: cert-manager-presync-gate
    namespace: cert-manager
roleRef:
  kind: ClusterRole
  name: cert-manager-presync-gate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-manager-presync-gate
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  # Without a deadline a pod that can never start (unschedulable, or mounting a
  # Secret that doesn't exist) leaves the hook Running forever, and ArgoCD's
  # syncPolicy.retry only fires on a sync that terminates as Failed. Every hook
  # Job in this repo sets one so a stall becomes a failure ArgoCD can retry.
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: cert-manager-presync-gate
    spec:
      serviceAccountName: cert-manager-presync-gate
      restartPolicy: Never
      containers:
        - name: presync-gate
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Retry a command until it succeeds, bounded at ~5 min. Used by
              # every hook in this repo so waiting behaves the same way
              # everywhere.
              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              # `kubectl wait` errors out immediately rather than waiting when
              # the object doesn't exist yet, so confirm existence first and
              # only then wait on the condition.
              wait_for() {
                cond=$1
                shift
                retry kubectl get "$@"
                kubectl wait --for=condition="$cond" "$@" --timeout=300s
              }

              # The CRDs this app's resources are instances of.
              wait_for Established \
                crd/clusterissuers.cert-manager.io \
                crd/certificates.cert-manager.io

              # The controller that issues certificates, the webhook that
              # admits them, and the cainjector that fills in the webhook's CA
              # bundle.
              wait_for Available \
                deployment/cert-manager \
                deployment/cert-manager-webhook \
                deployment/cert-manager-cainjector \
                -n cert-manager

              # Available only means the pods are Ready - the webhook's Service
              # endpoints can still be a moment behind, and its injected CA
              # bundle a moment behind that. A server-side dry-run goes through
              # the real webhook but creates nothing, so it's the only check
              # that proves the whole admission path works end to end.
              cat <<'EOF' > /tmp/probe.yaml
              apiVersion: cert-manager.io/v1
              kind: ClusterIssuer
              metadata:
                name: presync-gate-admission-probe
              spec:
                selfSigned: {}
              EOF
              retry kubectl create --dry-run=server -f /tmp/probe.yaml

              echo "cert-manager is ready to admit and issue certificates"
