# The smoke test's own RBAC is scoped to PostSync too - it exists only to
# run the Job below, so it shouldn't linger in the cluster once the test
# passes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-smoke-test
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  # `patch` matters on a retry: a re-run's `kubectl apply` finds the object
  # already there and patches instead of creating it.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: cert-manager-smoke-test
    namespace: cert-manager
roleRef:
  kind: ClusterRole
  name: cert-manager-smoke-test
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-manager-smoke-test
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  # Without a deadline a pod that can never start (unschedulable, or mounting a
  # Secret that doesn't exist) leaves the hook Running forever, and ArgoCD's
  # syncPolicy.retry only fires on a sync that terminates as Failed. Every hook
  # Job in this repo sets one so a stall becomes a failure ArgoCD can retry.
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: cert-manager-smoke-test
    spec:
      serviceAccountName: cert-manager-smoke-test
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Retry a command until it succeeds, bounded at ~5 min. Used by
              # every smoke test in this repo so waiting behaves the same way
              # everywhere.
              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              # No waiting for cert-manager itself here: this app's PreSync gate
              # already proved the webhook admits and demo-ca can issue, which
              # is why the test can get straight to the point.
              kubectl create namespace test-certs \
                --dry-run=client -o yaml | kubectl apply -f -

              cat <<'EOF' > /tmp/example-cert.yaml
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: example-cert
                namespace: test-certs
              spec:
                secretName: example-cert-tls
                duration: 2160h # 90 days
                renewBefore: 240h # 10 days
                privateKey:
                  algorithm: RSA
                  size: 4096
                  rotationPolicy: Always
                commonName: "example.mydomain.com"
                dnsNames:
                  - "example.mydomain.com"
                  - "www.example.mydomain.com"
                subject:
                  organizationalUnits:
                  - "Demo Apps"
                  organizations:
                  - "Demo Apps"
                  countries:
                  - "CA"
                usages:
                  - server auth
                  - client auth
                  - digital signature
                  - key encipherment
                issuerRef:
                  name: demo-ca
                  kind: ClusterIssuer
                  group: cert-manager.io
              EOF

              # Still retried: the gate's dry-run proves the webhook was serving
              # a moment ago, not that it still is.
              retry kubectl apply -f /tmp/example-cert.yaml

              if kubectl wait --for=condition=Ready certificate/example-cert -n test-certs --timeout=300s; then
                echo "example-cert is Ready, cleaning up test-certs namespace"
                # --wait=false: the ServiceAccount only has get/create/delete on
                # namespaces (not watch/list), so a waiting delete hangs forever
                # trying to observe termination.
                kubectl delete namespace test-certs --wait=false
                exit 0
              else
                echo "example-cert did not become Ready in time; leaving test-certs namespace for debugging"
                exit 1
              fi
