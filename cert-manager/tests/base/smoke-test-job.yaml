# The smoke test's own RBAC is scoped to PostSync too - it exists only to
# run the Job below, so it shouldn't linger in the cluster once the test
# passes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-smoke-test
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  # `patch` matters on a retry: a re-run's `kubectl apply` finds the object
  # already there and patches instead of creating it.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  # For the `kubectl wait` on the cert-manager webhook pods below.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: cert-manager-smoke-test
    namespace: cert-manager
roleRef:
  kind: ClusterRole
  name: cert-manager-smoke-test
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-manager-smoke-test
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      name: cert-manager-smoke-test
    spec:
      serviceAccountName: cert-manager-smoke-test
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Retry a command until it succeeds, bounded at ~5 min. Used by
              # every smoke test in this repo so waiting behaves the same way
              # everywhere.
              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              # Creating a Certificate goes through cert-manager's validating
              # webhook, which returns a hard "connection refused" (a failed
              # sync, not a retried one) if its pods aren't serving yet.
              # `kubectl wait` errors out immediately rather than waiting when
              # nothing matches yet, so wait for existence first, then
              # readiness. (`get -l` exits 0 on an empty list, hence the -n
              # test.)
              webhook_exists() {
                [ -n "$(kubectl get pod -l app.kubernetes.io/component=webhook \
                  -n cert-manager -o name 2>/dev/null)" ]
              }
              retry webhook_exists
              kubectl wait --for=condition=Ready pod \
                -l app.kubernetes.io/component=webhook \
                -n cert-manager --timeout=300s

              kubectl create namespace test-certs \
                --dry-run=client -o yaml | kubectl apply -f -

              cat <<'EOF' > /tmp/example-cert.yaml
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: example-cert
                namespace: test-certs
              spec:
                secretName: example-cert-tls
                duration: 2160h # 90 days
                renewBefore: 240h # 10 days
                privateKey:
                  algorithm: RSA
                  size: 4096
                  rotationPolicy: Always
                commonName: "example.mydomain.com"
                dnsNames:
                  - "example.mydomain.com"
                  - "www.example.mydomain.com"
                subject:
                  organizationalUnits:
                  - "Demo Apps"
                  organizations:
                  - "Demo Apps"
                  countries:
                  - "CA"
                usages:
                  - server auth
                  - client auth
                  - digital signature
                  - key encipherment
                issuerRef:
                  name: demo-ca
                  kind: ClusterIssuer
                  group: cert-manager.io
              EOF

              # Retried as well as waited for: the webhook's pods can be Ready
              # a moment before its Service endpoints actually accept traffic.
              retry kubectl apply -f /tmp/example-cert.yaml

              if kubectl wait --for=condition=Ready certificate/example-cert -n test-certs --timeout=300s; then
                echo "example-cert is Ready, cleaning up test-certs namespace"
                # --wait=false: the ServiceAccount only has get/create/delete on
                # namespaces (not watch/list), so a waiting delete hangs forever
                # trying to observe termination.
                kubectl delete namespace test-certs --wait=false
                exit 0
              else
                echo "example-cert did not become Ready in time; leaving test-certs namespace for debugging"
                exit 1
              fi
