# The operator hardcodes its own namespace (cert-manager-operator) and the
# operand's namespace (cert-manager) - not configurable via the Subscription.
# It also auto-creates a default CertManager CR named "cluster" if none exists,
# so no CertManager CR needs to be authored here.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
spec:
  channel: stable-v1
  name: cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
