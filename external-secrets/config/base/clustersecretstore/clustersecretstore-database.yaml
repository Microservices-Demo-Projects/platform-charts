# A second store pointed at the same Vault, distinct from local-vault-backend
# only in `version: v1`. That field defaults to v2 (confirmed in the
# ClusterSecretStore CRD schema) even when omitted, and v2 makes ESO rewrite
# every path through the store into the kv-v2 shape (.../data/...), which is
# wrong for the `database` secrets engine postgres/config/base/external-secret.yaml
# reads from - that mount isn't KV at all, so its paths (e.g.
# database/static-creds/postgres-superuser) must be read literally. Must be
# set explicitly, not just left off.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-vault-backend-database
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: cluster-secret-store
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      version: v1
      caProvider:
        type: Secret
        name: external-secrets-tls
        key: ca.crt
        namespace: external-secrets
      tls:
        certSecretRef:
          name: external-secrets-tls
          key: tls.crt
          namespace: external-secrets
        keySecretRef:
          name: external-secrets-tls
          key: tls.key
          namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
