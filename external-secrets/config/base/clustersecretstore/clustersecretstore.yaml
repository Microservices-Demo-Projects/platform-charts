apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-vault-backend
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: cluster-secret-store
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      version: v1
      # CA certificate to validate Vault's server certificate
      caProvider:
        type: Secret
        name: external-secrets-tls
        key: ca.crt
        namespace: external-secrets
      # Client certificate for mTLS authentication (renamed from clientTLS in
      # the external-secrets.io/v1beta1 -> v1 API). ClusterSecretStore is
      # cluster-scoped, so unlike a namespaced SecretStore these refs have no
      # implicit namespace - it must be given explicitly, same as caProvider
      # above.
      tls:
        certSecretRef:
          name: external-secrets-tls
          key: tls.crt
          namespace: external-secrets
        keySecretRef:
          name: external-secrets-tls
          key: tls.key
          namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
