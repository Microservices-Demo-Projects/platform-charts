# Registers this namespace with OpenShift GitOps so its application-controller
# gets a namespace-scoped admin RoleBinding here (covers the OperatorConfig CR
# above, and the namespaced Certificate wave-050-external-secrets-config.yaml
# applies) - but only once the namespace is also listed in the ArgoCD CR's
# spec.namespaceManagement with allowManagedBy: true, which is a one-time
# manual step - see
# ../../../../argocd/openshift/0-prerequisite-argocd-setup/local-argocd-setup.md.
# CreateNamespace=true on the Application would otherwise create this
# namespace bare, without the label.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
