# Unlike cert-manager-operator, this operator does not hardcode a namespace or
# auto-create a default CR - it's installed here (OwnNamespace) into the same
# "external-secrets" namespace the operand runs in on Kubernetes, and an
# OperatorConfig (operatorconfig.yaml) must be authored by hand to get the
# controller running.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: external-secrets-operator
  namespace: external-secrets
spec:
  channel: stable
  name: external-secrets-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
