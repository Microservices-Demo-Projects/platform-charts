# Required before the operator will deploy anything - it has no default CR of
# its own. An empty spec takes the operator's own defaults, which is all this
# needs: the ESO controller pods, RBAC, and CRDs come up the same as the
# Kubernetes-side Helm chart.
#
# sync-wave "1" (vs. the implicit "0" on operatorgroup.yaml/subscription.yaml)
# defers this until after the Subscription's CSV has installed the
# OperatorConfig CRD - paired with SkipDryRunOnMissingResource=true on the
# Application (see wave-030-external-secrets-operator.yaml), since otherwise
# ArgoCD's upfront dry-run validation for this resource fails before the CRD
# exists and poisons the whole sync, including the OperatorGroup/Subscription
# that would have created that CRD in the first place.
apiVersion: operator.external-secrets.io/v1alpha1
kind: OperatorConfig
metadata:
  name: cluster
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec: {}
