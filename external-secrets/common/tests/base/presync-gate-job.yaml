# PreSync gate: nothing in this app is applied until External Secrets is running
# and Vault is actually answering.
#
# This app applies the local-vault-backend ClusterSecretStore, which connects to
# Vault as soon as it exists. Applied too early it lands as
# `Ready=False InvalidProviderConfig: unable to create client` - which is exactly
# how this app failed on the first bootstrap, purely because Vault wasn't up yet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-presync-gate
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # list/watch as well as get, so `kubectl wait` can observe the change.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Read-only on the Vault CR in the vault namespace, to check its leader.
  - apiGroups: ["vault.banzaicloud.com"]
    resources: ["vaults"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: external-secrets-presync-gate
    namespace: external-secrets
roleRef:
  kind: ClusterRole
  name: external-secrets-presync-gate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: external-secrets-presync-gate
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  # Without a deadline a pod that can never start (unschedulable, or mounting a
  # Secret that doesn't exist) leaves the hook Running forever, and ArgoCD's
  # syncPolicy.retry only fires on a sync that terminates as Failed. Every hook
  # Job in this repo sets one so a stall becomes a failure ArgoCD can retry.
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: external-secrets-presync-gate
    spec:
      serviceAccountName: external-secrets-presync-gate
      restartPolicy: Never
      containers:
        - name: presync-gate
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Retry a command until it succeeds, bounded at ~5 min. Used by
              # every hook in this repo so waiting behaves the same way
              # everywhere.
              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              # `kubectl wait` errors out immediately rather than waiting when
              # the object doesn't exist yet, so confirm existence first and
              # only then wait on the condition.
              wait_for() {
                cond=$1
                shift
                retry kubectl get "$@"
                kubectl wait --for=condition="$cond" "$@" --timeout=300s
              }

              # The CRD the ClusterSecretStore is an instance of.
              wait_for Established crd/clustersecretstores.external-secrets.io

              # The controller that reconciles the store, the webhook that
              # admits it, and the cert-controller that serves that webhook.
              wait_for Available \
                deployment/external-secrets \
                deployment/external-secrets-webhook \
                deployment/external-secrets-cert-controller \
                -n external-secrets

              # A leader means Vault is initialised, unsealed and answering -
              # the same field the Vault health check assesses. Without this the
              # store is created against a Vault that can't yet serve it.
              vault_has_leader() {
                [ -n "$(kubectl get vault vault -n vault \
                  -o jsonpath='{.status.leader}' 2>/dev/null)" ]
              }
              retry vault_has_leader

              echo "External Secrets is running and Vault has a leader"
