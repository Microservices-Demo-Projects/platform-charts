# The smoke test's own RBAC is scoped to PostSync too - it exists only to
# run the Job below, so it shouldn't linger in the cluster once the test
# passes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-smoke-test
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  # `patch` matters on a retry: a re-run's `kubectl apply` finds the object
  # already there and patches instead of creating it.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: external-secrets-smoke-test
    namespace: external-secrets
roleRef:
  kind: ClusterRole
  name: external-secrets-smoke-test
  apiGroup: rbac.authorization.k8s.io
---
# Grants the smoke-test Job permission to `kubectl exec` into the vault-0 pod
# in the vault namespace, so it can write/read/delete a throwaway Vault KV
# entry using the vault CLI already present in that pod (same approach used
# manually in manual/README.md). It also needs to read the operator-managed
# vault-unseal-keys Secret to get a root token - the vault-0 container has no
# VAULT_TOKEN env var set, and there's no service account/JWT auth method
# configured for this exec-based approach.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-smoke-test-vault-exec
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # `kubectl exec` reads the pod before attaching, so it needs `get` too.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["vault-unseal-keys"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-smoke-test-vault-exec
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: external-secrets-smoke-test
    namespace: external-secrets
roleRef:
  kind: Role
  name: external-secrets-smoke-test-vault-exec
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: external-secrets-smoke-test
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  # Without a deadline a pod that can never start (unschedulable, or mounting a
  # Secret that doesn't exist) leaves the hook Running forever, and ArgoCD's
  # syncPolicy.retry only fires on a sync that terminates as Failed. Every hook
  # Job in this repo sets one so a stall becomes a failure ArgoCD can retry.
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: external-secrets-smoke-test
    spec:
      serviceAccountName: external-secrets-smoke-test
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Retry a command until it succeeds, bounded at ~5 min. Used by
              # every smoke test in this repo so waiting behaves the same way
              # everywhere.
              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              NS=test-eso
              VAULT_NS=vault
              VAULT_POD=vault-0
              KV_PATH=kv/eso-smoke-test
              EXPECTED=smoke-test-ok

              cleanup_ok() {
                echo "Cleaning up test resources"
                kubectl delete externalsecret smoke-test -n "$NS" --ignore-not-found
                # --wait=false: the ServiceAccount only has get/create/delete on
                # namespaces (not watch/list), so a waiting delete hangs forever
                # trying to observe termination.
                kubectl delete namespace "$NS" --ignore-not-found --wait=false
                kubectl exec -n "$VAULT_NS" "$VAULT_POD" -- env VAULT_SKIP_VERIFY=true VAULT_TOKEN="$VAULT_TOKEN" vault kv delete "$KV_PATH" || true
              }

              kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

              # No waiting for Vault here: this app's PreSync gate already proved
              # Vault has elected a leader, so vault-0 is up and answering.

              # The vault-0 container has no VAULT_TOKEN env var set, so fetch
              # the operator-generated root token to authenticate the CLI. The
              # operator creates this Secret during first-boot init, so it may
              # not exist the moment this job starts.
              retry kubectl get secret vault-unseal-keys -n "$VAULT_NS"
              VAULT_TOKEN=$(kubectl get secret vault-unseal-keys -n "$VAULT_NS" -o jsonpath='{.data.vault-root}' | base64 -d)

              # 1. Write a throwaway secret into Vault's KV engine
              # VAULT_SKIP_VERIFY: vault's default VAULT_ADDR is 127.0.0.1:8200,
              # whose cert SAN doesn't include a bare IP match for verification
              # inside exec; the manual README uses the same flag.
              kubectl exec -n "$VAULT_NS" "$VAULT_POD" -- env VAULT_SKIP_VERIFY=true VAULT_TOKEN="$VAULT_TOKEN" vault kv put "$KV_PATH" value="$EXPECTED"

              # 2. Create an ExternalSecret referencing it via the local-vault-backend ClusterSecretStore
              cat <<EOF | kubectl apply -f -
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              metadata:
                name: smoke-test
                namespace: $NS
              spec:
                refreshInterval: 15s
                secretStoreRef:
                  name: local-vault-backend
                  kind: ClusterSecretStore
                target:
                  name: smoke-test-secret
                  creationPolicy: Owner
                data:
                - secretKey: value
                  remoteRef:
                    key: $KV_PATH
                    property: value
              EOF

              # 3. Wait for the resulting Kubernetes Secret to appear with the expected value
              synced() {
                [ "$(kubectl get secret smoke-test-secret -n "$NS" \
                  -o go-template='{{ index .data "value" | base64decode }}' 2>/dev/null)" = "$EXPECTED" ]
              }
              retry synced || true

              ACTUAL=$(kubectl get secret smoke-test-secret -n "$NS" \
                -o go-template='{{ index .data "value" | base64decode }}' 2>/dev/null || true)

              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "smoke-test-secret synced correctly from Vault via ClusterSecretStore/local-vault-backend"
                cleanup_ok
                exit 0
              else
                echo "smoke-test-secret did not sync the expected value in time (got: '$ACTUAL')."
                echo "Leaving namespace '$NS' and Vault path '$KV_PATH' in place for debugging."
                exit 1
              fi
