# The only thing allowed to use the vault-ipc-lock SCC: the `vault`
# ServiceAccount, which backs both the Vault StatefulSet and the
# vault-configurer Deployment. The vault-operator's own pod runs under
# `vault-operator` and is untouched by this - it needs no extra capabilities.
#
# `use` on a securitycontextconstraints resourceName is how OpenShift grants an
# SCC; a RoleBinding (not ClusterRoleBinding) keeps the grant confined to the
# vault namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-use-ipc-lock-scc
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["vault-ipc-lock"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-use-ipc-lock-scc
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: ClusterRole
  name: vault-use-ipc-lock-scc
  apiGroup: rbac.authorization.k8s.io
