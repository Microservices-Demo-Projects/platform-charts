# PreSync gate: nothing in this app is applied until both of its prerequisites
# are genuinely usable.
#
# This is the gate that matters most. The original bootstrap failure was here:
# Certificate/vault-tls was applied 3 seconds before cert-manager's webhook
# started serving, so it was rejected outright - but the Vault CR in the same
# app applied fine, and the operator then looped forever on
# `failed to get tls secret for vault`. Applying the Vault CR before its
# certificate can exist is the deadlock, and this gate makes it impossible.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-presync-gate
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # list/watch as well as get, so `kubectl wait` can observe the change.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get", "list", "watch"]
  # `create` is what a server-side dry-run authorises against - it runs the
  # admission chain and then discards the object, so nothing is created.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: vault-presync-gate
    namespace: vault
roleRef:
  kind: ClusterRole
  name: vault-presync-gate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-presync-gate
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  # Without a deadline a pod that can never start (unschedulable, or mounting a
  # Secret that doesn't exist) leaves the hook Running forever, and ArgoCD's
  # syncPolicy.retry only fires on a sync that terminates as Failed. Every hook
  # Job in this repo sets one so a stall becomes a failure ArgoCD can retry.
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: vault-presync-gate
    spec:
      serviceAccountName: vault-presync-gate
      restartPolicy: Never
      containers:
        - name: presync-gate
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Retry a command until it succeeds, bounded at ~5 min. Used by
              # every hook in this repo so waiting behaves the same way
              # everywhere.
              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              # `kubectl wait` errors out immediately rather than waiting when
              # the object doesn't exist yet, so confirm existence first and
              # only then wait on the condition.
              wait_for() {
                cond=$1
                shift
                retry kubectl get "$@"
                kubectl wait --for=condition="$cond" "$@" --timeout=300s
              }

              # The CA that issues vault-tls. Not Ready means no certificate,
              # which means the Vault pods never start.
              wait_for Ready clusterissuer/demo-ca

              # The operator that turns the Vault CR into running pods, and the
              # CRD that makes the CR applyable at all.
              wait_for Established crd/vaults.vault.banzaicloud.com
              wait_for Available deployment/vault-operator -n vault

              # The exact apply that failed on the first bootstrap, as a
              # server-side dry-run: same kind, same namespace, same issuer as
              # vault-tls. It goes through cert-manager's real webhook but
              # creates nothing, so it proves the admission path is up before
              # the Vault CR is allowed anywhere near the cluster.
              cat <<'EOF' > /tmp/probe.yaml
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: presync-gate-admission-probe
                namespace: vault
              spec:
                secretName: presync-gate-admission-probe
                commonName: presync-gate-admission-probe
                dnsNames:
                  - presync-gate-admission-probe
                issuerRef:
                  name: demo-ca
                  kind: ClusterIssuer
                  group: cert-manager.io
              EOF
              retry kubectl create --dry-run=server -f /tmp/probe.yaml

              echo "demo-ca can issue, and vault-operator is ready for the Vault CR"
