# ArgoCD has no built-in health check for vault.banzaicloud.com/Vault, so
# without this the vault-config Application would report Healthy the moment
# the CR is created - before Vault is actually unsealed and has a raft
# leader - letting later waves (external-secrets-config, postgres) sync
# against a Vault that isn't usable yet. ServerSideApply merges just this
# `data` key into argocd-cm without touching other operator-managed settings.
# status.leader/conditions confirmed against vault-operator:1.24.0's CRD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.vault.banzaicloud.com_Vault: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for the Vault raft cluster to elect a leader"
    if obj.status ~= nil then
      for i, condition in ipairs(obj.status.conditions or {}) do
        if condition.type == "Failed" and condition.status == "True" then
          hs.status = "Degraded"
          hs.message = condition.message or condition.error or "Vault reconciliation failed"
          return hs
        end
      end
      if obj.status.leader ~= nil and obj.status.leader ~= "" then
        hs.status = "Healthy"
        hs.message = "Vault raft cluster has a leader: " .. obj.status.leader
        return hs
      end
    end
    return hs
