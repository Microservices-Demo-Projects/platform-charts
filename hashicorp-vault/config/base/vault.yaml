# Vault server ServiceAccount. The Vault CR's spec.serviceAccount below
# references this. It needs `system:auth-delegator` so Vault's own
# `kubernetes` auth method can call the TokenReview API to validate
# ServiceAccount tokens presented by clients (external-secrets, apps, etc.)
# authenticating against Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
# Vault itself (via the bank-vaults sidecar) reads and writes the
# vault-unseal-keys/vault-root Secrets in this namespace directly through
# the Kubernetes API - that's what makes unsealConfig.kubernetes fully
# automatic. The vault-operator's own ClusterRole only covers what the
# *operator* needs; the Vault pod's own ServiceAccount needs this
# separately.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: Role
  name: vault
  apiGroup: rbac.authorization.k8s.io
---
# The Vault custom resource. The bank-vaults vault-operator (deployed by
# chart/ at sync-wave 30) watches for this and reconciles it into a
# StatefulSet, Services, TLS wiring, and - critically - fully automated
# init + unseal (no manual `vault operator init`/`unseal` required, and no
# manual re-unseal after restarts, unlike manual/README.md).
#
# CRD reference confirmed against
# oci://ghcr.io/bank-vaults/helm-charts/vault-operator:1.24.0
# (charts/crds/crds/vault.banzaicloud.com_vaults.yaml) and the operator's own
# deploy/examples/*.yaml (bank-vaults/vault-operator @ main).
apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: vault
spec:
  # 3-node Raft (integrated storage) quorum - real HA, unlike the manual
  # path's single-node "standalone" + file storage.
  size: 3

  image: hashicorp/vault:2.0.4
  # Sidecar image the operator injects to drive init/unseal/config. Falls
  # back to the operator chart's bankVaults.image if left unset; pinned here
  # for reproducibility.
  bankVaultsImage: ghcr.io/bank-vaults/bank-vaults:v1.33.1

  serviceAccount: vault
  serviceType: ClusterIP

  # Bring our own cert-manager-issued certificate (config/base/certificate.yaml)
  # instead of letting the operator mint a self-signed one.
  existingTlsSecretName: vault-tls

  # Distribute the CA bundle backing vault-tls to other namespaces that need
  # to validate Vault's server certificate (e.g. external-secrets' mTLS
  # client).
  caNamespaces:
    - external-secrets

  # This is what makes init + unseal fully automatic: on first boot the
  # operator generates the root token + unseal key shares and stores them in
  # this Kubernetes Secret, then automatically re-unseals every Vault pod
  # (including after restarts) using the same Secret. Nobody ever runs
  # `vault operator init` / `vault operator unseal` by hand on this path.
  unsealConfig:
    kubernetes:
      secretNamespace: vault
      secretName: vault-unseal-keys

  # Raft (integrated storage) needs its own per-pod volume.
  volumeClaimTemplates:
    - metadata:
        name: vault-raft
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

  volumeMounts:
    - name: vault-raft
      mountPath: /vault/file

  # A YAML representation of the final vault.hcl server config.
  # See https://developer.hashicorp.com/vault/docs/configuration for details.
  config:
    disable_mlock: true
    storage:
      raft:
        path: /vault/file
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_cert_file: /vault/tls/server.crt
        tls_key_file: /vault/tls/server.key
        tls_min_version: "tls13"
    api_addr: "https://vault.vault.svc.cluster.local:8200"
    cluster_addr: "https://${.Env.POD_NAME}:8201"
    ui: true

  # Declarative Vault configuration, applied by the operator's bank-vaults
  # sidecar once the cluster is unsealed: policies, the `kubernetes` auth
  # method + roles, and the secrets engines the rest of the platform depends
  # on (kv-v2 for generic secrets, database for postgres's rotating creds).
  #
  # externalConfig is free-form (the CRD only declares it as
  # x-kubernetes-preserve-unknown-fields); the shape below matches
  # bank-vaults' own vault-config.yml / deploy/examples/cr-raft.yaml schema.
  externalConfig:
    policies:
      - name: external-secrets-readonly-policy
        rules: |
          path "kv/*" {
            capabilities = ["read", "list"]
          }
          path "database/creds/*" {
            capabilities = ["read", "list"]
          }

    auth:
      - type: kubernetes
        # bank-vaults auto-fills config.kubernetes_host from
        # $KUBERNETES_SERVICE_HOST when no `config:` block is given, which is
        # correct for an in-cluster API server, so no config block is needed
        # here.
        roles:
          # Bound to external-secrets' own ServiceAccount (external-secrets/
          # external-secrets), matching the `role: external-secrets` /
          # `serviceAccountRef` used by external-secrets'
          # config/base/clustersecretstore/clustersecretstore.yaml.
          - name: external-secrets
            bound_service_account_names: ["external-secrets"]
            bound_service_account_namespaces: ["external-secrets"]
            policies: ["external-secrets-readonly-policy"]
            ttl: 1h

    secrets:
      - path: kv
        type: kv
        description: General-purpose secrets for the platform.
        options:
          version: 2

      - path: database
        type: database
        description: Dynamic, rotating PostgreSQL credentials.
        configuration:
          config:
            - name: pocdb
              plugin_name: postgresql-database-plugin
              allowed_roles: ["app-ro", "app-rw", "app-setup"]
              # postgres/config/base/cluster.yaml's pg_hba mandates mTLS-only
              # auth for the `vault` role (no password fallback: `hostssl all
              # vault ... cert clientcert=verify-full`), so this connects with
              # the same cert-manager-issued client cert the operator already
              # mounts into this pod for the server listener
              # (existingTlsSecretName: vault-tls, CN "vault" - trusted by
              # postgres's clientCASecret, which shares the demo-ca bundle).
              # No username/password: Postgres identifies the role purely by
              # the client cert's CN via pg_hba's `cert` method.
              connection_url: "postgresql://postgres-rw.postgres.svc.cluster.local:5432/pocdb?sslmode=verify-full&sslrootcert=/vault/tls/ca.crt&sslcert=/vault/tls/server.crt&sslkey=/vault/tls/server.key"
              # MUST be false: postgres does not exist yet when this first
              # syncs at wave 40. The mount would otherwise fail to apply.
              # The postgres component's own smoke test is what actually
              # exercises this connection once postgres exists.
              verify_connection: false
          # SQL carried over verbatim from the manual path's Phase 3
          # instructions (see postgres/README.md).
          roles:
            - name: app-ro
              db_name: pocdb
              creation_statements: |
                CREATE ROLE "vlt_app_ro_{{name}}"
                WITH LOGIN PASSWORD '{{password}}'
                VALID UNTIL '{{expiration}}';
                GRANT app_ro TO "vlt_app_ro_{{name}}";
              default_ttl: "1h"
              max_ttl: "24h"
            - name: app-rw
              db_name: pocdb
              creation_statements: |
                CREATE ROLE "vlt_app_rw_{{name}}"
                WITH LOGIN PASSWORD '{{password}}'
                VALID UNTIL '{{expiration}}';
                GRANT app_rw TO "vlt_app_rw_{{name}}";
              default_ttl: "1h"
              max_ttl: "24h"
            - name: app-setup
              db_name: pocdb
              creation_statements: |
                CREATE ROLE "vlt_setup_{{name}}"
                WITH LOGIN PASSWORD '{{password}}'
                VALID UNTIL '{{expiration}}';
                GRANT ALL PRIVILEGES ON DATABASE pocdb TO "vlt_setup_{{name}}";
              default_ttl: "1h"
              max_ttl: "24h"
