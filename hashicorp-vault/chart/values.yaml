# Wrapper chart configuring the 'vault-operator' subchart (bank-vaults
# community operator, Apache-2.0, NOT HashiCorp-official). Deploys only the
# operator - the actual Vault server is a separate `Vault` CR under
# config/base/vault.yaml that the operator reconciles.
# See manual/README.md for the old, hand-run `hashicorp/vault` chart path.

vault-operator:
  replicaCount: 1

  # CRDs (the `Vault` CRD) are installed by this chart by default.
  crds:
    install: true

  image:
    repository: ghcr.io/bank-vaults/vault-operator
    pullPolicy: IfNotPresent

  # Bank-Vaults sidecar image used by the operator for init/unseal/config
  # reconciliation of the Vault CR (distinct from spec.bankVaultsImage set on
  # individual Vault CRs, which defaults to this same image if unset).
  bankVaults:
    image:
      repository: ghcr.io/bank-vaults/bank-vaults
      tag: "v1.33.1"

  # Watch every namespace by default so a single operator instance can manage
  # the `vault` namespace (and any future Vault CRs elsewhere). Narrow this to
  # "vault" if you want a namespace-scoped operator instead.
  watchNamespace: ""

  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
