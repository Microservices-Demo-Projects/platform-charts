# ServiceAccount for the smoke-test Job. RBAC is scoped to `get` on exactly
# the `vault-unseal-keys` Secret, in case the container image is ever swapped
# for one that reads it via the Kubernetes API (e.g. `kubectl get secret`)
# rather than via a native `secretKeyRef` env mount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-smoke-test
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-smoke-test
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vault-unseal-keys"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-smoke-test
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault-smoke-test
    namespace: vault
roleRef:
  kind: Role
  name: vault-smoke-test
  apiGroup: rbac.authorization.k8s.io
---
# PostSync hook: writes, reads, and deletes a throwaway KV secret to verify
# the bank-vaults-managed Vault is up, unsealed, and reachable over TLS using
# the operator-generated root token - proving the fully-automated init/unseal
# path actually worked, with no human running `vault operator init/unseal`.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-smoke-test
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    metadata:
      name: vault-smoke-test
    spec:
      serviceAccountName: vault-smoke-test
      restartPolicy: Never
      volumes:
        - name: vault-ca
          secret:
            secretName: vault-tls
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: smoke-test
          image: hashicorp/vault:2.0.4
          env:
            - name: VAULT_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            - name: VAULT_CACERT
              value: /vault/tls/ca.crt
            # The operator stores the root token it generated during
            # first-boot init under the "vault-root" key of the
            # vault-unseal-keys Secret (same Secret referenced by
            # spec.unsealConfig.kubernetes in config/base/vault.yaml).
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: vault-root
          volumeMounts:
            - name: vault-ca
              mountPath: /vault/tls
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -e

              KV_PATH="kv/smoke-test"
              EXPECTED="ok"

              echo "Writing $KV_PATH..."
              vault kv put "$KV_PATH" value="$EXPECTED"

              echo "Reading $KV_PATH..."
              ACTUAL=$(vault kv get -field=value "$KV_PATH")

              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "smoke-test succeeded: got expected value '$ACTUAL'"
                vault kv delete "$KV_PATH"
                exit 0
              else
                echo "smoke-test FAILED: expected '$EXPECTED', got '$ACTUAL'"
                echo "Leaving kv/smoke-test in place for debugging."
                exit 1
              fi
